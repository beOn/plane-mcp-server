# Ephemeral Plane instance for integration tests.
# Isolated ports and volumes — no collision with dev stack.
#
# Usage:
#   ./scripts/setup-test-env.sh   # start + seed
#   pytest tests/ -v              # run tests
#   ./scripts/teardown-test-env.sh # destroy

services:
  test-db:
    image: postgres:15.7-alpine
    restart: "no"
    networks:
      - test_env
    command: postgres -c 'max_connections=500'
    volumes:
      - test_pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: plane
      POSTGRES_PASSWORD: plane
      POSTGRES_DB: plane
      PGDATA: /var/lib/postgresql/data
    ports:
      - "15432:5432"

  test-redis:
    image: valkey/valkey:7.2.11-alpine
    restart: "no"
    networks:
      - test_env
    volumes:
      - test_redisdata:/data
    ports:
      - "16379:6379"

  test-mq:
    image: rabbitmq:3.13.6-management-alpine
    restart: "no"
    networks:
      - test_env
    volumes:
      - test_rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: plane
      RABBITMQ_DEFAULT_PASS: plane
      RABBITMQ_DEFAULT_VHOST: plane
    ports:
      - "15672:5672"

  test-minio:
    image: minio/minio
    restart: "no"
    networks:
      - test_env
    entrypoint: >
      /bin/sh -c "
      mkdir -p /export/uploads &&
      minio server /export --console-address ':9090' &
      sleep 3 &&
      mc alias set myminio http://localhost:9000 access-key secret-key &&
      mc mb myminio/uploads -p || true &&
      tail -f /dev/null
      "
    volumes:
      - test_uploads:/export
    environment:
      MINIO_ROOT_USER: access-key
      MINIO_ROOT_PASSWORD: secret-key
    ports:
      - "19000:9000"

  test-migrator:
    build:
      context: ../plane/apps/api
      dockerfile: Dockerfile.dev
    restart: "no"
    networks:
      - test_env
    volumes:
      - ../plane/apps/api:/code
    command: ./bin/docker-entrypoint-migrator.sh --settings=plane.settings.local
    env_file:
      - .env.test-stack
    depends_on:
      - test-db
      - test-redis

  test-api:
    build:
      context: ../plane/apps/api
      dockerfile: Dockerfile.dev
    restart: "no"
    networks:
      - test_env
    volumes:
      - ../plane/apps/api:/code
    command: ./bin/docker-entrypoint-api-local.sh
    env_file:
      - .env.test-stack
    depends_on:
      - test-db
      - test-redis
      - test-mq
      - test-migrator
    ports:
      - "18000:8000"

  test-worker:
    build:
      context: ../plane/apps/api
      dockerfile: Dockerfile.dev
    restart: "no"
    networks:
      - test_env
    volumes:
      - ../plane/apps/api:/code
    command: ./bin/docker-entrypoint-worker.sh
    env_file:
      - .env.test-stack
    depends_on:
      - test-api
      - test-db
      - test-redis

volumes:
  test_pgdata:
  test_redisdata:
  test_uploads:
  test_rabbitmq_data:

networks:
  test_env:
    driver: bridge
